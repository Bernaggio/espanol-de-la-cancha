function learn(n,i){LN={n,i};tab('tree');const it=n.i[i],t=ty(it.s);
A.innerHTML=`<p class="mu">${n.e} ${n.t} · ${i+1}/${n.i.length}</p>${i?'':`<div class="card"><b>V téhle lekci se učíš:</b><br>${comp(n)}</div>${n.k?`<p class="tip">💡 ${n.k}</p>`:''}`}<div class="card c t${t}"><span class="chip t${t}">${TN[t]}</span><div class="es">${it.s}</div><div class="fon">${it.f}</div><div class="cs">${it.c}</div>${it.x?`<p>${it.x}<br><small>${it.y}</small></p>`:''}${sp(esc(it.s))}</div><p class="mu">🎤 Řekni to nahlas a porovnej se zvukem.</p><div class="row">${i?'<button class="big alt" data-step="-1">←</button>':''}<button class="big" data-step="1">${i+1<n.i.length?'Dál':'Otestuj se'}</button></div>`;say(it.s)}
function rate(it,g){if(!BY[it.s])return;const c=S.cards[it.s]||(S.cards[it.s]={b:1,d:day(1)});c.b=g?Math.min(c.b+1,4):1;c.d=day(IV[c.b-1])}
function quiz(items,srs,cb){const q=sh(items),mode=RM;RM=0;let i=0,ok=0,K,ws=[],pl=[];
const kind=it=>mode===3?(i%2?'typ':'ord'):mode===0?'mc':mode===1||(S.cards[it.s]||{}).b>=2?(i%2?'dict':'typ'):'mc';
const pw=()=>{$('bd').innerHTML=ws.map(x=>pl[x]).join(' ')||'…';$('pl').innerHTML=pl.map((w,j)=>ws.includes(j)?'':`<button class="g" data-w="${j}">${esc(w)}</button>`).join('')};
const step=()=>{if(i>=q.length)return cb(ok,q.length);const it=q[i],t=ty(it.s);K=kind(it);ws=[];const hd=`<p class="mu">${i+1}/${q.length} <span class="chip t${t}">${TN[t]}</span></p>`;
if(K==='mc'){const o=pick(it);A.innerHTML=hd+`<h2>${it.c}</h2>${o.map(x=>`<button class="o" data-a="${esc(x.s)}"><span>${x.s}</span><span class="oi"></span></button>`).join('')}<div id="fb"></div>`}
else if(K==='ord'){pl=sh(it.s.split(' '));A.innerHTML=hd+`<h2>${it.c}</h2><p class="mu">Poskládej větu ze slov:</p><div class="card" id="bd"></div><div id="pl"></div><div class="row"><button class="big alt" style="width:34%" data-clr>Smazat</button><button class="big" data-ok>Zkontrolovat</button></div><div id="fb"></div>`;pw()}
else{A.innerHTML=hd+(K==='dict'?`<h2>Napiš, co slyšíš</h2>${sp(esc(it.s))}`:`<h2>${it.c}</h2>`)+`<input id="ti" autocomplete="off" autocapitalize="off" placeholder="Španělsky…"><button class="big" data-ok>Zkontrolovat</button><div id="fb"></div>`;$('ti').focus();if(K==='dict')say(it.s)}};
const show=(g,keys,it)=>{if(g)ok++;if(srs){rate(it,g);save()}say(it.s);
const banner=`<div class="vb ${g?'ok':'bad'}"><span class="vbi">${g?'✅':'❌'}</span><span>${g?'Správně!':'Špatně'}${keys.includes('acc')?'<small>Smysl sedí, ale zkontroluj přízvuky/ñ.</small>':''}</span></div>`;
const box=`<div class="correct-box"><small>${g?'Ještě jednou pro upevnění:':'Správně je:'}</small><br><b class="es2">${it.s}</b> <span class="fon">${it.f||''}</span>${sp(esc(it.s))}</div>`;
$('fb').innerHTML=banner+pf(...keys.filter(k=>k!=='ok'&&k!=='bad'))+box+`<button class="big" data-next>Dál</button>`};
H.w=b=>{ws.push(+b.dataset.w);pw()};H.clr=()=>{ws=[];pw()};
H.ans=b=>{const it=q[i],g=b.dataset.a===it.s;document.querySelectorAll('.o').forEach(x=>{x.disabled=true;const oi=x.querySelector('.oi');if(x.dataset.a===it.s){x.classList.add('ok');if(oi)oi.textContent='✔'}});if(!g){b.classList.add('no');const oi=b.querySelector('.oi');if(oi)oi.textContent='✘'}show(g,[g?'ok':'bad'],it)};
H.ok=()=>{const it=q[i],o=K==='ord',v=o?ws.map(x=>pl[x]).join(' '):$('ti').value.trim();if(!v||document.querySelector('#fb .vb'))return;if(!o)$('ti').disabled=true;else document.querySelectorAll('#pl button').forEach(x=>x.disabled=true);
const g=(o?st(it.s):br(it.s))===(o?st(v):br(v)),pf2=st(it.s)===st(v);const k=[];
if(g&&pf2)k.push('ok');else if(g)k.push('ok','acc');else k.push('bad');if(o&&!g)k.push('ord');
if(g&&/^[¿¡]/.test(it.s)&&!/^[¿¡]/.test(v))k.push('q');
if(g){if(!o)S.st.t++;if(o||ty(it.s)==='v')S.st.s++}show(g,k,it)};
H.next=()=>{i++;step()};step()}
function fin(n,ok,t){const p=Math.round(ok/t*100),m=p>=90?'🥇 zlato':p>=70?'🥈 stříbro':'🥉 bronz',x=ok*10+20;bump();S.xp+=x;
if(!S.nodes[n.id]||p>=S.nodes[n.id].p)S.nodes[n.id]={p,m};n.i.forEach(it=>{if(!S.cards[it.s])S.cards[it.s]={b:1,d:day(1)}});save();
A.innerHTML=`<h1>${m}</h1><p>${ok}/${t} správně (${p} %) · +${x} XP</p><div class="card">Fráze se ti vrátí v opakování za 1, 3 a 7 dní. ${p<70?'Pod 70 % radši projdi lekci ještě jednou.':'Teď každou frázi řekni nahlas.'}</div><button class="big" data-go="tree">Strom dovedností</button>`}
function review(){tab('rev');const k=due().filter(s=>BY[s]);if(!k.length){A.innerHTML='<h1>Opakování</h1><div class="card">Dnes nic nedluží. Nová slova přijdou na řadu za 1, 3 a 7 dní po lekci.</div>';return}
RM=2;quiz(k.slice(0,10).map(s=>BY[s]),1,(ok,t)=>{bump();S.xp+=ok*5;save();A.innerHTML=`<h1>${ok}/${t}</h1><p>Opakování hotovo, +${ok*5} XP.</p><button class="big" data-go="home">Domů</button>`})}
const RS=[['Slova','A0','strom dovedností'],['Psaní a diktát','A1','píšeš z hlavy bez nabídky'],['Věty','A1','skládání a překlad vět'],['Rozhovory s nápovědou','A2','krátké dialogy s Profe'],['Rozhovory bez opory','A2→B1','dialogy z hlavy']],NEED=['','dokonči 1 lekci','napiš správně 15 slov','sestav 10 vět','dokonči 3 rozhovory'];
const unl=()=>[1,N.some(n=>S.nodes[n.id]),S.st.t>=15,S.st.s>=10,S.st.d>=3],prog=()=>[N.filter(n=>S.nodes[n.id]).length+'/'+N.length+' lekcí',S.st.t+'/15 slov',S.st.s+'/10 vět',S.st.d+'/3 rozhovory',S.st.d+' rozhovorů celkem'];
function road(){const u=unl(),p=prog();return`<div class="card"><h3>Tvoje cesta</h3>${RS.map((r,i)=>`<div class="stg ${u[i]?'on':''}"><b>${u[i]?(u[i+1]?'✅':'▶️'):'🔒'} ${i+1}. ${r[0]}</b> <small>${r[1]} · ${u[i]?p[i]:'odemkne se: '+NEED[i]}</small></div>`).join('')}</div>`}
const DL={zaklady:['Poprvé v kabině',[['P','Hola, ¿cómo te llamas?','Ahoj, jak se jmenuješ?'],['U',['me llamo*'],'Řekni, jak se jmenuješ: Me llamo…'],['P','Mucho gusto. ¿De dónde eres?','Těší mě. Odkud jsi?'],['U',['soy de la república checa','soy de praga','soy checo'],'Řekni, že jsi z České republiky.'],['P','¿Hablas inglés?','Mluvíš anglicky?'],['U',['no entiendo','hablo poco*','no'],'Řekni, že nerozumíš nebo mluvíš málo.']]],
jidlo:['V restauraci',[['P','Buenas tardes. ¿Qué quieres comer?','Dobré odpoledne. Co si dáš k jídlu?'],['U',['quiero agua*'],'Řekni, že chceš vodu.'],['P','¿Algo más?','Ještě něco?'],['U',['tengo hambre','no, gracias'],'Řekni, že máš hlad.'],['P','Muy bien. Un momento.','Dobře. Chvilku.'],['U',['la cuenta*'],'Popros o účet.']]],
konverzace:['U lajny',[['P','¿Cómo te sientes?','Jak se cítíš?'],['U',['estoy listo','estoy bien','estoy cansado'],'Řekni, jak se cítíš.'],['P','¿Dónde te duele?','Kde tě to bolí?'],['U',['no pasa nada','necesito agua'],'Řekni: to nic, nebo potřebuji vodu.'],['P','¡Vamos a ganar!','Vyhrajeme!'],['U',['vamos*','tienes razón'],'Odpověz týmu: Vamos!']]],
'cas-mista':['Cesta na zápas',[['P','Perdón, ¿dónde está el hotel?','Promiňte, kde je hotel?'],['U',['todo recto','a la derecha','a la izquierda'],'Ukaž směr: rovně / doprava / doleva.'],['P','¿Está lejos?','Je to daleko?'],['U',['está cerca','no, está cerca','está lejos','sí, está lejos'],'Řekni, že je to blízko.'],['P','Gracias.','Děkuji.'],['U',['de nada'],'Řekni: Není zač.']]],
media:['Po zápase',[['P','¿Cómo fue el partido?','Jaký byl zápas?'],['U',['fue un partido difícil'],'Řekni: Byl to těžký zápas.'],['P','¿Ganamos o perdimos?','Vyhráli jsme, nebo prohráli?'],['U',['ganamos','perdimos','empatamos'],'Řekni výsledek jedním slovem.'],['P','¿Y ahora?','A teď?'],['U',['tenemos que mejorar'],'Řekni: Musíme se zlepšit.']]]};
function dlg(k,blind){const[ti,L]=DL[k];let p=0,h='',w=0;
const nx=()=>{while(p<L.length&&L[p][0]==='P'){const l=L[p++];h+=`<div class="tc"><p class="es2">${l[1]}</p>${sp(esc(l[1]))}<details><summary>Překlad</summary>${l[2]}</details></div>`;say(l[1])}
if(p>=L.length){bump();S.st.d++;const x=Math.max(10,30-w*5);S.xp+=x;save();A.innerHTML=`<h1>🗣️ ${ti}</h1>${h}${pf(w>1?'bad':'ok')}<p>+${x} XP · chyb nebo nápověd: ${w}</p><button class="big" data-go="tea">Zpět k Profe</button>`;return}
A.innerHTML=`<h1>🗣️ ${ti}</h1>${h}<p class="tip">${blind?'Bez nápovědy: odpověz z hlavy.':'🎯 '+L[p][2]}</p><input id="ti" autocomplete="off" autocapitalize="off" placeholder="Španělsky…"><div class="row"><button class="big alt" style="width:34%" data-hint>Nevím</button><button class="big" data-ok>Odeslat</button></div><div id="fb"></div>`;$('ti').focus()};
H.ok=()=>{const v=$('ti').value.trim();if(!v)return;const a=L[p][1],g=a.some(x=>x.endsWith('*')?br(v).startsWith(br(x.slice(0,-1))):br(x)===br(v)),m=a[0].replace('*','…');h+=`<div class="me">${esc(v)}</div>`;
if(g)h+=`<div class="tc">${pf('ok')}</div>`;else{w++;h+=`<div class="tc">${pf('bad')}<p><b>${m}</b></p>${sp(esc(m))}</div>`}p++;nx()};
H.hint=()=>{w++;$('fb').innerHTML=`<p class="tip">Například: <b>${L[p][1][0].replace('*','…')}</b></p>`};nx()}
function tea(){tab('tea');const u=unl(),av=Object.keys(DL).filter(k=>N.some(n=>n.b===k&&S.nodes[n.id])),B=(i,m,t)=>u[i]?`<button class="big" data-mode="${m}">${t}</button>`:`<button class="big alt" disabled>🔒 ${t}</button>`;
A.innerHTML=`<h1>🧑‍🏫 Profe</h1><p class="mu">Offline učitel: zadává úlohy, opravuje a hodnotí španělsky, česky je vždy pod tím.</p>${road()}${B(1,'act','✍️ Psaní a diktát')}${B(2,'sent','🧩 Věty')}<p>Rozhovor:</p><select id="sc">${av.map(k=>`<option value="${k}">${DL[k][0]}</option>`).join('')||'<option value="">dokonči lekci s rozhovorem 🟪</option>'}</select><br><br>${B(3,'dlg','🗣️ Rozhovor s nápovědou')}${B(4,'blind','🎯 Rozhovor bez opory')}`}
function startT(m){if(m==='dlg'||m==='blind'){const k=$('sc').value;return k?dlg(k,m==='blind'):0}
const kn=Object.keys(S.cards).map(s=>BY[s]).filter(Boolean),ex=N.filter(n=>S.nodes[n.id]).flatMap(n=>n.i).filter(x=>x.x).map(x=>({s:x.x,c:x.y,f:''})),
pool=m==='sent'?[...kn.filter(x=>ty(x.s)==='v'&&x.s.split(' ').length<9&&!/\/|…|\.\.\./.test(x.s)),...ex]:kn;
if(pool.length<4){A.innerHTML='<p class="tip">Zatím málo látky. Dokonči další lekce.</p><button class="big" data-go="tea">Zpět</button>';return}
RM=m==='sent'?3:1;quiz(sh(pool).slice(0,8),1,(ok,t)=>{bump();S.xp+=ok*10;save();A.innerHTML=`<h1>${ok}/${t}</h1>${pf(ok/t>=.7?'ok':'bad')}<p>+${ok*10} XP</p><button class="big" data-go="tea">Zpět k Profe</button>`})}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ti'){e.preventDefault();H.ok()}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
home();
</script></body></html>
